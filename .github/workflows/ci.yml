name: Validate Libraseer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q stackarr run.py tests

      - name: Release matcher regression tests
        env:
          STACKARR_NO_SCHED: "true"
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Import audiobook adapter
        env:
          STACKARR_NO_SCHED: "true"
        run: python -c "import stackarr.audiobridge; print('Libraseer import OK')"
